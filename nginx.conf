server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed, immutable assets
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Prerendered pages first, then the SPA fallback (adapter-static fallback: '200.html')
    location / {
        try_files $uri $uri.html $uri/index.html /200.html;
    }
}
